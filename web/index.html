<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pico.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pico 2 W Dashboard</title>
    <!-- Apply saved appearance before first paint (no theme flash). Mirrors src/lib/appearance.js. -->
    <script>
      (function () {
        var r = document.documentElement
        try {
          var s = JSON.parse(localStorage.getItem('pico.appearance') || '{}')
          var mode = ['system', 'light', 'dark'].indexOf(s.mode) >= 0 ? s.mode : 'dark'
          var scheme = /^[a-h]$/.test(s.scheme) ? s.scheme : 'a'
          var pattern = typeof s.pattern === 'string' ? s.pattern : 'off'
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode
          r.setAttribute('data-mode', resolved)
          r.setAttribute('data-palette', scheme)
          r.setAttribute('data-bg', pattern)
        } catch (e) {
          r.setAttribute('data-mode', 'dark')
          r.setAttribute('data-palette', 'a')
          r.setAttribute('data-bg', 'off')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
